name: live-map

# Run a LIVE agentic mapping from the browser: repo -> Actions -> live-map ->
# "Run workflow". Requires one repo secret, CLAUDE_CODE_OAUTH_TOKEN, minted
# locally with `claude setup-token` (runs on a Claude subscription; no API
# key, no card). CI otherwise never calls a model - the build-and-deploy
# workflow only replays the recorded proposal.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Variant seed for an unseen-conventions demo (leave empty for the canonical fixture)"
        type: string
        default: ""
      record:
        description: "Commit the accepted proposal as the new recorded run (canonical only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  propose-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check the subscription token is configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing repo secret CLAUDE_CODE_OAUTH_TOKEN. Mint one locally with 'claude setup-token', then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Generate the world and the unknown source
        env:
          SEED: ${{ inputs.seed }}
        run: |
          python generate_sources.py
          if [ -n "$SEED" ]; then
            python generate_unknown_source.py --seed "$SEED"
          else
            python generate_unknown_source.py
          fi
      - name: Live propose (model gets a voice)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then
            python mapper/propose_mapping.py --backend claude-cli \
              --source "incoming/variant_${SEED}.txt" \
              --out "mapper/runs/variant_${SEED}.json"
          else
            python mapper/propose_mapping.py --backend claude-cli
          fi
      - name: Deterministic gates (the vote)
        env:
          SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then
            python mapper/validate_mapping.py \
              --proposal "mapper/runs/variant_${SEED}.json" \
              --source "incoming/variant_${SEED}.txt" \
              --report "mapper/runs/variant_${SEED}_report.md" \
              --out "mapper/runs/variant_${SEED}_conformed.csv"
          else
            python mapper/validate_mapping.py
          fi
      - name: Build the evidence page (canonical runs only)
        if: ${{ inputs.seed == '' }}
        run: python build_mapping_page.py
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-run
          path: |
            mapper/recorded/proposal.json
            mapper/recorded/validation_report.md
            mapper/runs/
            warehouse/warranty_conformed.csv
            output/mapping.html
          if-no-files-found: ignore
      - name: Commit the new recorded run
        if: ${{ inputs.record && inputs.seed == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapper/recorded/
          git diff --cached --quiet && echo "recorded run unchanged" || {
            git commit -m "Record live mapping run from workflow_dispatch"
            git push
          }
