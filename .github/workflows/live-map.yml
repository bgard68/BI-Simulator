name: live-map

# Run a LIVE agentic mapping from the browser: repo -> Actions -> live-map ->
# "Run workflow".
#
# The model credential is fetched at run time from Azure Key Vault using
# GitHub's OIDC token -- there is no long-lived secret in this repo. Entra ID
# trusts this workflow by federated credential (subject
# repo:bgard68/BI-Simulator:ref:refs/heads/main); the workflow presents a
# short-lived token, Azure exchanges it, and the secret never leaves the run.
# Requires three non-secret variables: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID.
#
# Fallback: if AZURE_CLIENT_ID is absent, the workflow uses a plain
# CLAUDE_CODE_OAUTH_TOKEN repo secret instead.
#
# CI otherwise never calls a model - build-and-deploy only replays the
# recorded proposal.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Variant seed for an unseen-conventions demo (leave empty for the canonical fixture)"
        type: string
        default: ""
      record:
        description: "Commit the accepted proposal as the new recorded run (canonical only)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write        # required for the OIDC exchange with Entra ID

jobs:
  propose-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check a credential path is configured
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] && [ -z "$TOKEN" ]; then
            echo "::error::No credential path configured. Either set repo variables AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (Key Vault via OIDC), or add a CLAUDE_CODE_OAUTH_TOKEN repo secret. Mint the token locally with 'claude setup-token'."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Azure login (OIDC - no stored credential)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch the model credential from Key Vault
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: |
          TOKEN=$(az keyvault secret show --vault-name "${{ vars.AZURE_KEYVAULT_NAME || 'bisim-kv-41d09d' }}" --name claude-code-oauth-token --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Generate the world and the unknown source
        env:
          SEED: ${{ inputs.seed }}
        run: |
          python generate_sources.py
          if [ -n "$SEED" ]; then
            python generate_unknown_source.py --seed "$SEED"
          else
            python generate_unknown_source.py
          fi
      - name: Live propose (model gets a voice)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then
            python mapper/propose_mapping.py --backend claude-cli \
              --source "incoming/variant_${SEED}.txt" \
              --out "mapper/runs/variant_${SEED}.json"
          else
            python mapper/propose_mapping.py --backend claude-cli
          fi
      - name: Deterministic gates (the vote)
        env:
          SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then
            python mapper/validate_mapping.py \
              --proposal "mapper/runs/variant_${SEED}.json" \
              --source "incoming/variant_${SEED}.txt" \
              --report "mapper/runs/variant_${SEED}_report.md" \
              --out "mapper/runs/variant_${SEED}_conformed.csv"
          else
            python mapper/validate_mapping.py
          fi
      - name: Build the evidence page (canonical runs only)
        if: ${{ inputs.seed == '' }}
        run: python build_mapping_page.py
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-run
          path: |
            mapper/recorded/proposal.json
            mapper/recorded/validation_report.md
            mapper/runs/
            warehouse/warranty_conformed.csv
            output/mapping.html
          if-no-files-found: ignore
      - name: Commit the new recorded run
        if: ${{ inputs.record && inputs.seed == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapper/recorded/
          git diff --cached --quiet && echo "recorded run unchanged" || {
            git commit -m "Record live mapping run from workflow_dispatch"
            git push
          }
