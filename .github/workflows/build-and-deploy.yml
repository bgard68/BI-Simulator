name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the world and the unknown source
        run: |
          python generate_sources.py
          python generate_unknown_source.py
      - name: Agentic mapping replay gate (must pass before anything lands)
        id: replay
        run: python mapper/validate_mapping.py --require-approval
      - name: Schema drift - open a re-propose task
        if: ${{ failure() && steps.replay.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Mapping replay failed - re-propose needed"
          if gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --title "$TITLE" \
              --label "" \
              --body "$(printf 'The recorded mapping no longer satisfies its gates on commit %s.\n\nThis is the expected signal when a source changes shape: the replayed proposal is measured against the current file and stopped before anything lands. It is a task, not a build defect.\n\n1. `python mapper/live_run.py` to propose a fresh mapping\n2. review it: `python mapper/approve.py --show`\n3. sign it: `python mapper/approve.py --approve --by "<you>"`\n\nRun: %s/actions/runs/%s\n\n```\n%s\n```\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat mapper/recorded/validation_report.md 2>/dev/null | head -30)")"
          else
            echo "a re-propose issue is already open"
          fi
      - name: Flatten and build (19th source joins via its gated output)
        run: |
          python etl.py
          python build_dashboard.py
          python build_mapping_page.py
      - name: Gate test suite (corrupted proposals must be rejected)
        run: python -m unittest discover -s tests -v
      - name: External sources reachable (non-blocking)
        continue-on-error: true
        run: python fetch_external_sources.py
      - name: Assemble site
        run: |
          mkdir site
          cp output/dashboard.html site/index.html
          cp output/mapping.html site/mapping.html
          cp warehouse/flat_sales.csv site/flat_sales.csv
          cp warehouse/warranty_conformed.csv site/warranty_conformed.csv
          cp flatten_map.svg site/flatten_map.svg
          (cd sources && zip -r ../site/sources.zip .)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
